<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RPG engine — demo</title>

  <!-- Engine styles (relative to the engine dir → portable) -->
  <link rel="stylesheet" href="../css/reset.css">
  <link rel="stylesheet" href="../css/_variables.css">
  <link rel="stylesheet" href="../css/map.css">
  <link rel="stylesheet" href="../css/character.css">
  <!-- Debug outlines; inert unless <body> has the `debug` class (?debug=1). -->
  <link rel="stylesheet" href="../css/map-debug.css">

  <link rel="stylesheet" href="./demo.css">
</head>
<body>
  <header class="demo-header">
    <div class="demo-header__logo">🗺️</div>
    <div class="demo-header__text">
      <h1>RPG Engine <span class="demo-header__tag">demo</span></h1>
      <p class="demo-header__sub">Standalone showcase — public API only (<code>engine/index.js</code>)</p>
    </div>
  </header>

  <div class="demo-viewport-wrap">
    <div id="viewport" class="frame"></div>
  </div>

  <!-- Filled by the EventConsole under ?debug=1, left empty otherwise. -->
  <div id="event-console" class="demo-event-console"></div>

  <footer class="demo-footer">
    <div class="demo-hint demo-hint--keys">
      <span class="demo-hint__label">Walk</span>
      <span class="demo-hint__keys">
        <kbd>←</kbd><kbd>↑</kbd><kbd>↓</kbd><kbd>→</kbd>
      </span>
    </div>
    <div class="demo-hint demo-hint--debug">
      <span class="demo-hint__label">Debug mode</span>
      <a class="demo-hint__link" href="?debug=1"><code>?debug=1</code></a>
    </div>
  </footer>

  <!-- Touch D-pad — hidden on pointer (mouse) devices, visible on touch screens -->
  <nav class="touch-pad" aria-label="Movement controls">
    <button class="dpad-btn dpad-up"    data-key="ArrowUp"    aria-label="Move up">▲</button>
    <button class="dpad-btn dpad-left"  data-key="ArrowLeft"  aria-label="Move left">◀</button>
    <button class="dpad-btn dpad-down"  data-key="ArrowDown"  aria-label="Move down">▼</button>
    <button class="dpad-btn dpad-right" data-key="ArrowRight" aria-label="Move right">▶</button>
  </nav>

  <script type="module" src="./demo.js"></script>
</body>
</html>
